# Local PostgreSQL for the SRIIF portal backend.
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sriif
      POSTGRES_PASSWORD: sriif_local_only
      POSTGRES_DB: sriif
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sriif -d sriif"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
